name: Build & Release NxAuth

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build NxAuth
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 🔨 Build with Maven
        run: mvn clean package -B --no-transfer-progress

      - name: 📦 Rename JAR
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          mv target/NxAuth-*.jar target/NxAuth-${VERSION}.jar
          echo "JAR_NAME=NxAuth-${VERSION}.jar" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NxAuth-${{ env.VERSION }}
          path: target/NxAuth-${{ env.VERSION }}.jar
          retention-days: 30

      - name: 🧪 Print Build Info
        run: |
          echo "✅ Build successful!"
          echo "📦 File: ${{ env.JAR_NAME }}"
          echo "📏 Size: $(du -sh target/${{ env.JAR_NAME }} | cut -f1)"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 🔨 Build with Maven
        run: mvn clean package -B --no-transfer-progress

      - name: 📦 Get Version & Rename
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          mv target/NxAuth-*.jar target/NxAuth-${VERSION}.jar
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: 📝 Generate Release Notes
        id: release_notes
        run: |
          cat << 'EOF' > release_notes.md
          ## 🔐 NxAuth v${{ env.VERSION }}

          ### ✨ Features
          - Full Login/Register system with BCrypt hashing
          - Animated BossBar with countdown
          - Custom join screen (freeze, blindness, hide inventory)
          - Login particles & first-time register firework
          - CAPTCHA protection (math-based)
          - 2FA support (TOTP / Google Authenticator)
          - Bedrock (Geyser/Floodgate) auto-login support
          - Premium account auto-login
          - IP session memory
          - Anti-bot protection with auto-lockdown
          - Brute force protection with tempban
          - Per-world authentication
          - Maintenance mode with auto-kick
          - Dynamic MOTD (registered / unregistered / maintenance)
          - Sound effects on all auth events
          - Discord webhook notifications
          - In-game admin alerts
          - Multi-language support (EN, HI, ES +more)
          - Web dashboard (runs on server IP)
          - Config editor via web dashboard
          - Player manager via web dashboard
          - Auto database backup (SQLite + MySQL)
          - Export players to CSV
          - AuthMe migration support (coming soon)

          ### 📥 Installation
          1. Drop `NxAuth-${{ env.VERSION }}.jar` into your `plugins/` folder
          2. Restart server
          3. Edit `plugins/NxAuth/config.yml`
          4. Access web dashboard at `http://YOUR_IP:8080`

          ### ⚠️ Requirements
          - Paper 1.21.x or higher
          - Java 21+
          EOF

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NxAuth ${{ github.ref_name }}
          body_path: release_notes.md
          files: target/NxAuth-${{ env.VERSION }}.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
